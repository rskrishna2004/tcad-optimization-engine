# finfet_ion_hp.yaml -- 14nm N-type double-gate FinFET: maximize drive at a realistic
# leakage cap. measurement: 2vd -> ION, IOFF, gm, SS (sat) + DIBL/Vt in one run.
problem_id: finfet_ion_hp
device_class: finfet_dg_nmos
measurement: 2vd

operating:
  T_K: 300
  supplies: {VDD: 0.8, VB: 0.0}
  sweep: {electrode: gate, from: 0.0, to: 0.8, drain_at: 0.8}
  bias_sign: n

metric_extraction:
  vt_icrit_A_per_um: 1.0e-7
  gm_over_Id_targets_A_per_um: []

parameters:
  LG:     [0.018, 0.040, lin, um]
  TFIN:   [0.004, 0.010, lin, um]
  EOT:    [0.0008, 0.0012, lin, um]
  LSP:    [0.006, 0.014, lin, um]
  NSD:    [3.0e19, 1.2e20, log, cm-3]
  LATSD:  [0.25, 0.55, lin, ratio]
  NLDD:   [5.0e18, 5.0e19, log, cm-3]
  LATLDD: [0.30, 0.60, lin, ratio]
  NHALO:  [5.0e17, 5.0e18, log, cm-3]
  WHALO:  [0.006, 0.014, lin, um]
  NFIN:   [1.0e15, 5.0e17, log, cm-3]
  LSD:    {fixed: 0.020, unit: um}
  HG:     {fixed: 0.030, unit: um}
  HFIN:   {fixed: 0.030, unit: um}

constraints:
  hard:
    - LG   >= 0.018
    - TFIN <= 0.010
    - EOT  >= 0.0008
    - gate_material == metal_wf
  coupled: []

objectives:
  - {metric: ION, sense: max}
  - {metric: IOFF, cap: 1.0e-7}

models:
  band2band:    modifiedHurkx
  mobility:     [DopingDependence, "Enormal(IALMob)", HighFieldSaturation]
  recombination: [SRH, Auger]
  statistics:   Fermi
  intrinsic:    "EffectiveIntrinsicDensity(OldSlotboom)"

fidelity:
  search_mesh: standard
  verify_mesh_refine: 2.0
  verify_fidelity: [btbt_off_bound, nonlocal_path]
  verify_thresholds: {mesh_shift_pct: 10, btbt_frac_pct: 5}

budget: {max_evals: 800, parallel: 64, wall_clock_h: 8}
