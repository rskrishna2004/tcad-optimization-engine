# pmos_analog_gm_id.yaml
# GENERALIZATION TEST #2: a NEW device family (PMOS) AND a NEW target metric.
# The objective is NOT max ION/IOFF/gm -- it is the analog transconductance
# efficiency gm/Id at a fixed bias current (|Id| = 10 uA/um), i.e. "how much gain
# per microamp of current", the central analog/low-power figure of merit. ION/IOFF
# are demoted to CONSTRAINTS (a usable, non-leaky device). This drives the design
# in a qualitatively different direction than the digital problem (toward a steep,
# well-controlled subthreshold at low overdrive), proving the engine optimizes
# arbitrary physically-meaningful metrics, not just the ones it was built around.
# $Id: pmos_analog_gm_id.yaml, 2026/06/18 [YOUR NAME] $

problem_id: pmos_planar_analog_gm_id
device_class: planar_bulk_pmos           # p-type; flips dopant species + p-poly gate

operating:
  T_K: 350
  supplies: {VDD: -1.0, VB: 0.0}
  sweep: {electrode: gate, from: 0.0, to: -1.0, drain_at: -1.0}   # IdVg at VD=-VDD
  bias_sign: p                           # currents/voltages handled via |.|

# FoM extraction config consumed by the rich metric library (l3_exec.metrics):
metric_extraction:
  vt_icrit_A_per_um: 1.0e-7              # constant-current Vt criterion
  gm_over_Id_targets_A_per_um: [1.0e-5]  # -> metric gm_over_Id_at_10uA

parameters:                              # same structural knobs; template assigns
  LG:     [0.040, 0.20,  lin, um]        # p-type S/D (B), n-type channel/sub/halo
  TOX:    [0.0016, 0.004, lin, um]
  LSP:    [0.010, 0.060, lin, um]
  NSD:    [5.0e19, 3.0e20, log, cm-3]
  XJSD:   [0.025, 0.060, lin, um]
  LATSD:  [0.10, 0.90, lin, ratio]
  NLDD:   [1.0e19, 2.0e20, log, cm-3]
  XJLDD:  [0.0065, 0.040, lin, um]       # widened floor (lesson from NMOS audit)
  LATLDD: [0.30, 0.90, lin, ratio]
  NHALO:  [3.0e17, 5.0e18, log, cm-3]
  DHALO:  [0.008, 0.060, lin, um]
  SHALO:  [0.0138, 0.20, lin, um]        # widened floor (lesson from NMOS audit)
  WHALO:  [0.010, 0.060, lin, um]
  NCH:    [1.0e16, 5.0e18, log, cm-3]
  XCH:    [0.020, 0.080, lin, um]
  NSUB:   [1.0e16, 1.0e18, log, cm-3]
  NPOLY:  [1.0e20, 1.0e21, log, cm-3]
  LSD:    {fixed: 0.15, unit: um}
  HPOLY:  {fixed: 0.10, unit: um}
  HSUB:   {fixed: 0.80, unit: um}

constraints:
  hard:
    - LG   >= 0.040
    - TOX  >= 0.0016
    - XJSD >= 0.025
    - gate_material == p_poly
  coupled:
    - NCH >= 1.15 * NSUB

objectives:
  - {metric: gm_over_Id_at_10uA, sense: max}             # PRIMARY: analog efficiency
  - {metric: IOFF, cap: 1.0e-9}                          # constraint: low leakage
  - {metric: ION,  floor: 5.0e-5, penalty: 4.0}          # constraint: usable drive
  # score = log10(gm/Id @10uA) - 4*max(0, log10(IOFF/1e-9)) - 4*max(0, log10(5e-5/ION))

models:
  band2band:    modifiedHurkx
  mobility:     [DopingDependence, "Enormal(IALMob)", HighFieldSaturation]
  recombination: [SRH, Auger]
  statistics:   Fermi
  intrinsic:    "EffectiveIntrinsicDensity(OldSlotboom)"

fidelity:
  search_mesh: standard
  verify_mesh_refine: 2.0
  verify_fidelity: [btbt_off_bound, nonlocal_path]
  verify_thresholds: {mesh_shift_pct: 10, btbt_frac_pct: 5}

budget: {max_evals: 400, parallel: 30, wall_clock_h: 4}
